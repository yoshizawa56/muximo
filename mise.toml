[tools]
bun = "1.3.14"
node = "24.19.0"
tmux = "3.7b"

[tasks.install]
description = "Install the locked workspace dependencies"
run = "bun install --frozen-lockfile"

[tasks.ios]
description = "Build, sync, and open the Web iOS app"
raw = true
run = "bun --cwd apps/web run cap:sync && bun --cwd apps/web run cap:open"

[tasks.muximo]
description = "Run the local muximo CLI with the supplied arguments"
raw = true
raw_args = true
run = "bun apps/muximo-cli/src/index.ts --"

[tasks.web]
description = "Run the Web lifecycle CLI with the supplied arguments"
raw = true
raw_args = true
run = "bun apps/web/cli.ts --"

[tasks.check]
description = "Run the public-repository audit and project checks"
run = "bun run audit:public && bun run typecheck && bun run test && bun run build"
