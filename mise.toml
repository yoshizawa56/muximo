[tools]
bun = "1.3.14"
node = "24.19.0"
tmux = "3.7b"

[tasks.install]
description = "Install the locked workspace dependencies"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Start the local muximod and web development stack through Turbo and Portless"
run = "bun dev"

[tasks.dev-serve]
description = "Start the source development stack and upsert its Tailscale Serve route"
run = "bun run --filter serve dev"

[tasks.ios]
description = "Build, sync, and open the Web iOS app"
raw = true
run = "bun -F @muximo/web cap:sync && bun -F @muximo/web cap:open"

[tasks.muximo]
description = "Run the local muximo CLI with the supplied arguments"
raw = true
raw_args = true
run = "bun run --filter @muximo/muximo-cli dev --"

[tasks.check]
description = "Run the complete repository verification"
run = "bun run verify"
