pre-commit:
  parallel: false
  commands:
    biome:
      glob: "*.{js,ts,jsx,tsx,mjs,cjs}"
      run: node node_modules/@biomejs/biome/bin/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    typecheck:
      env:
        TURBO_TELEMETRY_DISABLED: "1"
      run: bun run typecheck

pre-push:
  commands:
    verify:
      env:
        TURBO_TELEMETRY_DISABLED: "1"
      run: bun run verify
