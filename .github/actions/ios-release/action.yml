name: Build and upload iOS app
description: Build, sign, validate, and upload the iOS app to App Store Connect.

inputs:
  asc_api_key_id:
    description: App Store Connect API key ID.
    required: true
  asc_issuer_id:
    description: App Store Connect issuer ID.
    required: true
  asc_api_private_key:
    description: Complete App Store Connect API private key contents.
    required: true
  dist_certificate_base64:
    description: Base64-encoded Apple Distribution certificate.
    required: true
  dist_certificate_password:
    description: Password for the Apple Distribution certificate.
    required: true
  app_store_profile_base64:
    description: Base64-encoded App Store provisioning profile.
    required: true

runs:
  using: composite
  steps:
    - name: Validate iOS release inputs
      shell: bash
      run: |
        set -euo pipefail

        case "$GITHUB_REF" in
          refs/tags/v*)
            release_tag="$GITHUB_REF_NAME"
            ;;
          refs/heads/*)
            package_version="$(node -p "require('./apps/web/package.json').version")"
            release_tag="v$package_version"
            ;;
          *)
            echo "Unsupported release ref: $GITHUB_REF" >&2
            exit 1
            ;;
        esac

        if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "Unsupported release tag: $release_tag" >&2
          echo "Expected a release tag or a branch with a valid apps/web/package.json version." >&2
          exit 1
        fi

        printf 'IOS_BUNDLE_ID=com.muximo.app\n' >> "$GITHUB_ENV"
        printf 'RELEASE_TAG=%s\n' "$release_tag" >> "$GITHUB_ENV"

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.0

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Build bundled web assets
      shell: bash
      run: |
        set -euo pipefail
        bun run --filter @muximo/web cap:sync

    - name: Prepare signing assets
      shell: bash
      env:
        IOS_DIST_CERTIFICATE_BASE64: ${{ inputs.dist_certificate_base64 }}
        IOS_DIST_CERTIFICATE_PASSWORD: ${{ inputs.dist_certificate_password }}
        IOS_APP_STORE_PROFILE_BASE64: ${{ inputs.app_store_profile_base64 }}
      run: |
        set -euo pipefail

        required=(
          IOS_DIST_CERTIFICATE_BASE64
          IOS_DIST_CERTIFICATE_PASSWORD
          IOS_APP_STORE_PROFILE_BASE64
        )
        missing=()
        for name in "${required[@]}"; do
          if [[ -z "${!name:-}" ]]; then
            missing+=("$name")
          fi
        done
        if (( ${#missing[@]} > 0 )); then
          printf 'Missing iOS signing inputs: %s\n' "${missing[*]}" >&2
          exit 1
        fi

        certificate_path="$RUNNER_TEMP/ios-distribution.p12"
        profile_path="$RUNNER_TEMP/ios-app-store.mobileprovision"
        profile_plist="$RUNNER_TEMP/ios-app-store-profile.plist"
        keychain_path="$RUNNER_TEMP/muximo-build.keychain-db"
        keychain_password="$(openssl rand -hex 32)"

        printf '%s' "$IOS_DIST_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
        printf '%s' "$IOS_APP_STORE_PROFILE_BASE64" | base64 --decode > "$profile_path"
        test -s "$certificate_path"
        test -s "$profile_path"

        security create-keychain -p "$keychain_password" "$keychain_path"
        security set-keychain-settings -lut 21600 "$keychain_path"
        security unlock-keychain -p "$keychain_password" "$keychain_path"
        security import "$certificate_path" \
          -P "$IOS_DIST_CERTIFICATE_PASSWORD" \
          -k "$keychain_path" \
          -T /usr/bin/codesign \
          -T /usr/bin/security \
          -T /usr/bin/xcodebuild
        security set-key-partition-list \
          -S apple-tool:,apple:,codesign: \
          -s \
          -k "$keychain_password" \
          "$keychain_path" >/dev/null
        security list-keychains -d user -s "$keychain_path"
        security default-keychain -s "$keychain_path"

        security cms -D -i "$profile_path" -o "$profile_plist"
        profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
        profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
        profile_team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
        profile_application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"

        if [[ ! "$profile_uuid" =~ ^[0-9A-Fa-f-]{36}$ ]]; then
          echo "The provisioning profile does not contain a valid UUID." >&2
          exit 1
        fi
        if [[ "$profile_application_identifier" != "$profile_team_id.$IOS_BUNDLE_ID" ]]; then
          echo "The provisioning profile is not for $IOS_BUNDLE_ID." >&2
          exit 1
        fi

        printf 'IOS_PROFILE_UUID=%s\n' "$profile_uuid" >> "$GITHUB_ENV"
        profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
        mkdir -p "$profiles_dir"
        cp "$profile_path" "$profiles_dir/$profile_uuid.mobileprovision"

        security find-identity -v -p codesigning "$keychain_path"
        security unlock-keychain -p "$keychain_password" "$keychain_path"
        echo "::add-mask::$keychain_password"
        {
          printf 'IOS_PROFILE_NAME=%s\n' "$profile_name"
          printf 'IOS_TEAM_ID=%s\n' "$profile_team_id"
        } >> "$GITHUB_ENV"

    - name: Set app version and build number
      shell: bash
      run: |
        set -euo pipefail

        marketing_version="${RELEASE_TAG#v}"
        marketing_version="${marketing_version%%-*}"
        if [[ ! "$marketing_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Could not derive an App Store version from $RELEASE_TAG." >&2
          exit 1
        fi
        if [[ ! "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || (( GITHUB_RUN_ATTEMPT > 999 )); then
          echo "GITHUB_RUN_ATTEMPT must be an integer from 1 to 999." >&2
          exit 1
        fi

        timestamp_millis="$(ruby -e 'puts (Time.now.to_f * 1000).floor')"
        printf -v build_number '%d%03d' "$timestamp_millis" "$GITHUB_RUN_ATTEMPT"
        if (( ${#build_number} > 18 )); then
          echo "The generated App Store build number is too long: $build_number" >&2
          exit 1
        fi

        {
          printf 'IOS_MARKETING_VERSION=%s\n' "$marketing_version"
          printf 'IOS_BUILD_NUMBER=%s\n' "$build_number"
        } >> "$GITHUB_ENV"

    - name: Archive iOS app
      shell: bash
      run: |
        set -euo pipefail

        xcode-select -p
        xcodebuild -version
        xcodebuild \
          -project apps/web/ios/App/App.xcodeproj \
          -scheme Release \
          -configuration Release \
          -sdk iphoneos \
          -destination generic/platform=iOS \
          -derivedDataPath "$RUNNER_TEMP/DerivedData" \
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
          -disableAutomaticPackageResolution \
          -archivePath "$RUNNER_TEMP/Muximo.xcarchive" \
          clean archive \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
          PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
          MARKETING_VERSION="$IOS_MARKETING_VERSION" \
          CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
          | tee "$RUNNER_TEMP/xcodebuild-archive.log"

    - name: Export App Store package
      shell: bash
      run: |
        set -euo pipefail

        export_options_path="$RUNNER_TEMP/ExportOptions.plist"
        export_path="$RUNNER_TEMP/export"
        xml_escape() {
          local value="$1"
          value="${value//&/&amp;}"
          value="${value//</&lt;}"
          value="${value//>/&gt;}"
          printf '%s' "$value"
        }
        profile_name_xml="$(xml_escape "$IOS_PROFILE_NAME")"
        cat > "$export_options_path" <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>destination</key>
          <string>export</string>
          <key>method</key>
          <string>app-store</string>
          <key>provisioningProfiles</key>
          <dict>
            <key>$IOS_BUNDLE_ID</key>
            <string>$profile_name_xml</string>
          </dict>
          <key>signingStyle</key>
          <string>manual</string>
          <key>teamID</key>
          <string>$IOS_TEAM_ID</string>
        </dict>
        </plist>
        EOF
        plutil -lint "$export_options_path"

        rm -rf "$export_path"
        xcodebuild \
          -exportArchive \
          -archivePath "$RUNNER_TEMP/Muximo.xcarchive" \
          -exportOptionsPlist "$export_options_path" \
          -exportPath "$export_path" \
          | tee "$RUNNER_TEMP/xcodebuild-export.log"

        ipa_path="$(find "$export_path" -maxdepth 1 -name '*.ipa' -print -quit)"
        test -n "$ipa_path"
        test -s "$ipa_path"

        printf 'IOS_IPA_PATH=%s\n' "$ipa_path" >> "$GITHUB_ENV"

    - name: Validate exported app metadata
      shell: bash
      run: |
        set -euo pipefail

        unzip -p "$IOS_IPA_PATH" "Payload/*.app/Info.plist" > "$RUNNER_TEMP/exported-info.plist"
        bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/exported-info.plist")"
        marketing_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/exported-info.plist")"
        build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/exported-info.plist")"

        test "$bundle_id" = "$IOS_BUNDLE_ID"
        test "$marketing_version" = "$IOS_MARKETING_VERSION"
        test "$build_number" = "$IOS_BUILD_NUMBER"

    - name: Upload to App Store Connect
      shell: bash
      env:
        IOS_ASC_API_KEY_ID: ${{ inputs.asc_api_key_id }}
        IOS_ASC_ISSUER_ID: ${{ inputs.asc_issuer_id }}
        IOS_ASC_API_PRIVATE_KEY: ${{ inputs.asc_api_private_key }}
      run: |
        set -euo pipefail

        required=(IOS_ASC_API_KEY_ID IOS_ASC_ISSUER_ID IOS_ASC_API_PRIVATE_KEY)
        missing=()
        for name in "${required[@]}"; do
          if [[ -z "${!name:-}" ]]; then
            missing+=("$name")
          fi
        done
        if (( ${#missing[@]} > 0 )); then
          printf 'Missing App Store Connect inputs: %s\n' "${missing[*]}" >&2
          exit 1
        fi

        private_keys_dir="$RUNNER_TEMP/private_keys"
        mkdir -p "$private_keys_dir"
        printf '%s' "$IOS_ASC_API_PRIVATE_KEY" > "$private_keys_dir/AuthKey_${IOS_ASC_API_KEY_ID}.p8"
        chmod 600 "$private_keys_dir/AuthKey_${IOS_ASC_API_KEY_ID}.p8"

        (
          cd "$RUNNER_TEMP"
          xcrun iTMSTransporter \
            -m upload \
            -assetFile "$IOS_IPA_PATH" \
            -apiIssuer "$IOS_ASC_ISSUER_ID" \
            -apiKey "$IOS_ASC_API_KEY_ID" \
            -v informational
        )

    - name: Upload iOS artifact
      if: ${{ always() }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-ios-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/export/*.ipa
          ${{ runner.temp }}/xcodebuild-archive.log
          ${{ runner.temp }}/xcodebuild-export.log
        if-no-files-found: warn
        retention-days: 1

    - name: Remove temporary signing assets
      if: ${{ always() }}
      shell: bash
      env:
        IOS_ASC_API_KEY_ID: ${{ inputs.asc_api_key_id }}
      run: |
        set +e

        security delete-keychain "$RUNNER_TEMP/muximo-build.keychain-db" 2>/dev/null || true
        rm -f \
          "$RUNNER_TEMP/ios-distribution.p12" \
          "$RUNNER_TEMP/ios-app-store.mobileprovision" \
          "$RUNNER_TEMP/ios-app-store-profile.plist" \
          "$RUNNER_TEMP/ExportOptions.plist" \
          "$RUNNER_TEMP/exported-info.plist" \
          "apps/web/.env.local"
        rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/export"
        if [[ -n "${IOS_PROFILE_UUID:-}" ]]; then
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
        fi
