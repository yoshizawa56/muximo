name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run repository checks
        uses: ./.github/actions/repository-checks

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Unsupported release ref: $GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            echo "Expected a tag such as v0.0.1 or v0.0.1-beta.1" >&2
            exit 1
          fi

  build-muximo:
    name: Build ${{ matrix.platform }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: bun-linux-x64
            asset: muximo-linux-x64
          - platform: linux-arm64
            target: bun-linux-arm64
            asset: muximo-linux-arm64
          - platform: macos-arm64
            target: bun-darwin-arm64
            asset: muximo-macos-arm64
          - platform: macos-x64
            target: bun-darwin-x64
            asset: muximo-macos-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build

      - name: Build standalone muximo executable
        env:
          MUXIMO_BUILD_TARGET: ${{ matrix.target }}
          MUXIMO_BUILD_OUTPUT: dist/${{ matrix.asset }}
        run: |
          mkdir -p dist
          bun run build:muximo
          chmod +x "$MUXIMO_BUILD_OUTPUT"
          chmod +x "dist/muximod-${{ matrix.platform }}"
          test -s "$MUXIMO_BUILD_OUTPUT"
          test -s "dist/muximod-${{ matrix.platform }}"
          file "$MUXIMO_BUILD_OUTPUT"

      - name: Upload standalone muximo executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-muximo-${{ matrix.platform }}
          path: |
            dist/${{ matrix.asset }}
            dist/muximod-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1

  build-ios:
    name: Build and upload iOS app
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    concurrency:
      group: ios-app-store-connect-upload
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and upload iOS app
        uses: ./.github/actions/ios-release
        with:
          asc_api_key_id: ${{ secrets.IOS_ASC_API_KEY_ID }}
          asc_issuer_id: ${{ secrets.IOS_ASC_ISSUER_ID }}
          asc_api_private_key: ${{ secrets.IOS_ASC_API_PRIVATE_KEY }}
          dist_certificate_base64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          dist_certificate_password: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          app_store_profile_base64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}

  release:
    name: Publish GitHub Release
    needs: [build-muximo, build-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-muximo-*
          path: dist
          merge-multiple: true

      - name: Validate standalone release assets
        shell: bash
        run: |
          set -euo pipefail

          expected_assets=(
            muximo-linux-x64
            muximo-linux-arm64
            muximo-macos-arm64
            muximo-macos-x64
            muximod-linux-x64
            muximod-linux-arm64
            muximod-macos-arm64
            muximod-macos-x64
          )
          for asset in "${expected_assets[@]}"; do
            test -s "dist/$asset"
          done

          expected_asset_list="$(printf '%s\n' "${expected_assets[@]}" | sort)"
          actual_asset_list="$(find dist -maxdepth 1 -type f -print | sed 's#^dist/##' | sort)"
          if [[ "$actual_asset_list" != "$expected_asset_list" ]]; then
            echo "Unexpected standalone release assets." >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_asset_list" "$actual_asset_list" >&2
            exit 1
          fi

      - name: Generate checksums
        shell: bash
        run: |
          (
            cd dist
            sha256sum \
              muximo-linux-x64 \
              muximo-linux-arm64 \
              muximo-macos-arm64 \
              muximo-macos-x64 \
              muximod-linux-x64 \
              muximod-linux-arm64 \
              muximod-macos-arm64 \
              muximod-macos-x64
          ) > dist/SHA256SUMS.txt

      - name: Add shell installer
        shell: bash
        run: cp install.sh dist/install.sh

      - name: Create or validate draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          release_is_prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_is_prerelease=true
          fi

          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
            --title "$RELEASE_TAG"
            --draft
          )
          if [[ "$release_is_prerelease" == true ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_state="$RUNNER_TEMP/release-state.json"
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease \
              > "$release_state"
            if [[ "$(jq -r '.isDraft' "$release_state")" != true ]]; then
              echo "Refusing to modify an existing public release: $RELEASE_TAG" >&2
              exit 1
            fi
          else
            gh release create \
              "$RELEASE_TAG" \
              "${release_args[@]}"
          fi

          if [[ "$release_is_prerelease" == true ]]; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --verify-tag
          else
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease=false \
              --verify-tag
          fi

      - name: Upload draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload \
            "$RELEASE_TAG" \
            dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify complete draft release asset set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          expected_assets=(
            SHA256SUMS.txt
            install.sh
            muximo-linux-x64
            muximo-linux-arm64
            muximo-macos-arm64
            muximo-macos-x64
            muximod-linux-x64
            muximod-linux-arm64
            muximod-macos-arm64
            muximod-macos-x64
          )
          expected_asset_list="$(printf '%s\n' "${expected_assets[@]}" | sort)"
          actual_asset_list="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | sort)"
          if [[ "$actual_asset_list" != "$expected_asset_list" ]]; then
            echo "Draft release asset set is incomplete or contains unexpected assets." >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_asset_list" "$actual_asset_list" >&2
            exit 1
          fi

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          release_edit_args=(
            "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --draft=false
            --verify-tag
          )
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_edit_args+=(--prerelease)
          else
            release_edit_args+=(--prerelease=false)
          fi
          gh release edit "${release_edit_args[@]}"
